<!DOCTYPE html>
<html
  lang="en"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Users</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h3 mb-0">Users</h1>
          <a th:href="@{/create-user}" class="btn btn-primary">Create user</a>
        </div>

        <div th:if="${#lists.isEmpty(users)}" class="alert alert-secondary">
          There are no users yet.
        </div>

        <ul th:unless="${#lists.isEmpty(users)}" class="list-group">
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            th:each="i: ${users}"
          >
            <div>
              <div class="fw-semibold" th:text="${i.getEmail()}"></div>
              <div class="text-muted small" th:text="'ID ' + ${i.getId()}"></div>
            </div>
            <button
              type="button"
              class="btn btn-outline-danger btn-sm delete-user"
              th:attr="aria-label='Delete ' + ${i.getEmail()}"
              th:data-delete-url="@{/users/{id}(id=${i.getId()})}"
            >
              Delete
            </button>
          </li>
        </ul>

        <nav th:replace="~{fragments/pagination :: pagination}"></nav>
      </div>

      <script th:src="@{/js/users.js}" defer></script>
    </section>
  </body>
</html>
