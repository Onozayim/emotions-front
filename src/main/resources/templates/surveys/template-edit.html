<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}"
>
  <head>
    <title>Edit survey template</title>
  </head>

  <body>
    <section layout:fragment="content">
      <div class="container">
        <h1 class="h3 mb-3">Edit survey template</h1>

        <form
          id="surveyTemplateForm"
          th:action="@{/survey-templates/{id}(id=${surveyTemplate.id})}"
          method="post"
        >
          <div class="mb-3">
            <label for="subject"> Subject </label>

            <input
              id="subject"
              type="text"
              name="subject"
              class="form-control"
              th:value="${surveyTemplate.subject}"
              required
            />
          </div>

          <div class="mb-3">
            <label for="message"> Message </label>

            <textarea
              id="message"
              name="message"
              class="form-control"
              rows="3"
              required
              th:text="${surveyTemplate.message}"
            ></textarea>
          </div>

          <div class="mb-4">
            <label for="emotion"> Emotion </label>

            <select id="emotion" name="emotion" class="form-select" required>
              <option
                value="positive"
                th:selected="${surveyTemplate.emotion == 'positive'}"
              >
                Positive
              </option>

              <option
                value="neutral"
                th:selected="${surveyTemplate.emotion == 'neutral'}"
              >
                Neutral
              </option>

              <option
                value="negative"
                th:selected="${surveyTemplate.emotion == 'negative'}"
              >
                Negative
              </option>
            </select>
          </div>

          <hr />

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Questions</h2>

            <button type="button" id="addQuestion" class="btn btn-primary">
              + Add Question
            </button>
          </div>

          <div id="questionsContainer"></div>

          <input type="hidden" id="template" name="template" />

          <script
            id="existingTemplate"
            type="application/json"
            th:utext="${surveyTemplate.template}"
          ></script>

          <hr />

          <div class="mt-4">
            <a th:href="@{/survey-templates}" class="btn btn-secondary">
              Cancel
            </a>

            <button type="submit" class="btn btn-success">Save Template</button>
          </div>
        </form>
      </div>

      <script th:src="@{/js/template-edit.js}" defer></script>
    </section>
  </body>
</html>
