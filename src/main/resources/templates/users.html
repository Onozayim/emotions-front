<!DOCTYPE html>
<html
  lang="es"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Bootstrap demo</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="w-75 mx-auto mb-2">
        <a th:href="@{/create-user}" class="btn btn-primary">Create user</a>
      </div>
      <ul class="list-group list-group-light w-75 m-auto">
        <li
          class="list-group-item d-flex justify-content-between align-items-center"
          th:each="i: ${users}"
        >
          <div>
            <div class="fw-bold" th:text="${i.getEmail()}"></div>
            <div class="text-muted small" th:text="'ID ' + ${i.getId()}"></div>
          </div>
          <button
            type="button"
            class="btn btn-outline-danger btn-sm"
            th:attr="aria-label='Delete ' + ${i.getEmail()}"
            th:onclick="|deleteUser(${i.getId()})|"
          >
            Delete
          </button>
        </li>
      </ul>

      <div class="w-75 m-auto">
        <ul class="pagination mb-0 mt-3">
          <li
            class="page-item"
            th:classappend="${page.first} ? 'disabled' : ''"
          >
            <a
              class="page-link"
              th:with="prevPage=${page.number - 1}"
              th:href="@{'?page=' + ${prevPage}}"
              >Ant</a
            >
          </li>

          <li
            class="page-item"
            th:if="${prevDots}"
            th:classappend="${page.first} ? 'disabled' : ''"
          >
            <a class="page-link" th:href="@{'?page=0'}">1</a>
          </li>

          <li class="page-item" th:if="${prevDots}">
            <a class="page-link">...</a>
          </li>

          <li
            class="page-item"
            th:each="i: ${pageNumbers}"
            th:classappend="${i == page.number + 1} ? 'active' : ''"
          >
            <a
              class="page-link"
              th:with="pageNum=${i - 1}"
              th:href="@{'?page=' + ${pageNum}}"
              th:text="${i}"
            ></a>
          </li>

          <li class="page-item" th:if="${nextDots}">
            <a class="page-link">...</a>
          </li>

          <li
            class="page-item"
            th:if="${nextDots}"
            th:classappend="${page.last} ? 'disabled' : ''"
          >
            <a
              class="page-link"
              th:with="lastPage=${page.totalPages - 1}"
              th:href="@{'?page=' + ${lastPage}}"
              th:text="${page.totalPages}"
            ></a>
          </li>

          <li class="page-item" th:classappend="${page.last} ? 'disabled' : ''">
            <a
              class="page-link"
              th:with="nextPage=${page.number + 1}"
              th:href="@{'?page=' + ${nextPage}}"
              >Sig</a
            >
          </li>
        </ul>
      </div>

      <script>
        function deleteUser(id) {
          Swal.fire({
            title: "Are you sure you want to delete the user?",
            text: "You won't be able to revert this!",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "Yes",
          }).then((result) => {
            if (result.isConfirmed) {
              fetch("/users/" + id, {
                method: "DELETE",
              })
                .then((response) => {
                  if (!response.ok) throw new Error("HTTP " + response.status);

                  Swal.fire({
                    title: "Deleted!",
                    text: "The user has been deleted.",
                    icon: "success",
                  }).then((result) => {
                    window.location.reload();
                  });
                })
                .catch((error) => {
                  Swal.fire({
                    title: "Error",
                    text: "The user could not be deleted. Please try again.",
                    icon: "error",
                  });
                });
            }
          });
        }
      </script>
    </section>
  </body>
</html>
