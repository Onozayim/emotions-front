<!DOCTYPE html>
<html
  lang="es"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Bootstrap demo</title>
  </head>
  <body>
    <section layout:fragment="content">
      <ul class="list-group list-group-light w-75 m-auto">
        <li
          class="list-group-item d-flex justify-content-between align-items-center"
          th:each="i: ${emails}"
        >
          <div>
            <div class="fw-bold"> <a th:href="@{'/email/' + ${i.getId()}}" th:text="${i.getFrom()}"></a></div>
            <div class="text-muted" th:text="${i.getSubject()}"></div>
          </div>
          <span th:if="${#strings.contains(i.getEmotion(), 'anger')}" style="width: 70px;" class="badge rounded-pill text-bg-danger" th:text="${i.getEmotion()}"></span>
          <span th:if="${#strings.contains(i.getEmotion(), 'joy') || #strings.contains(i.getEmotion(), 'love') || #strings.contains(i.getEmotion(), 'surprise')}" style="width: 70px;" class="badge rounded-pill text-bg-warning" th:text="${i.getEmotion()}"></span>
          <span th:if="${#strings.contains(i.getEmotion(), 'sadness') || #strings.contains(i.getEmotion(), 'fear')}" style="width: 70px;" class="badge rounded-pill text-bg-primary" th:text="${i.getEmotion()}"></span>
        </li>
      </ul>

      <div class="w-75 m-auto">
        <ul class="pagination mb-0 mt-3">
          <li
            class="page-item"
            th:classappend="${page.first} ? 'disabled' : ''"
          >
            <a
              class="page-link"
              th:with="prevPage=${page.number - 1}"
              th:href="@{'?page=' + ${prevPage}}"
              >Ant</a
            >
          </li>

          <li
            class="page-item"
            th:if="${prevDots}"
            th:classappend="${page.first} ? 'disabled' : ''"
          >
            <a class="page-link" th:href="@{'?page=0'}">1</a>
          </li>

          <li class="page-item" th:if="${prevDots}">
            <a class="page-link">...</a>
          </li>

          <li
            class="page-item"
            th:each="i: ${pageNumbers}"
            th:classappend="${i == page.number + 1} ? 'active' : ''"
          >
            <a
              class="page-link"
              th:with="pageNum=${i - 1}"
              th:href="@{'?page=' + ${pageNum}}"
              th:text="${i}"
            ></a>
          </li>

          <li class="page-item" th:if="${nextDots}">
            <a class="page-link">...</a>
          </li>

          <li
            class="page-item"
            th:if="${nextDots}"
            th:classappend="${page.last} ? 'disabled' : ''"
          >
            <a
              class="page-link"
              th:with="lastPage=${page.totalPages - 1}"
              th:href="@{'?page=' + ${lastPage}}"
              th:text="${page.totalPages}"
            ></a>
          </li>

          <li class="page-item" th:classappend="${page.last} ? 'disabled' : ''">
            <a
              class="page-link"
              th:with="nextPage=${page.number + 1}"
              th:href="@{'?page=' + ${nextPage}}"
              >Sig</a
            >
          </li>
        </ul>
      </div>
    </section>
  </body>
</html>
