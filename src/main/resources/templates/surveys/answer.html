<!doctype html>

<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}"
>
  <head>
    <title>Survey</title>
  </head>

  <body>
    <section layout:fragment="content">
      <div class="container">

        <div class="mb-4">
          <h1 th:text="${survey.subject}">Survey</h1>

          <p class="text-muted" th:text="${survey.message}">
            Survey description
          </p>
        </div>

        <form
          th:action="@{/survey/{token}(token=${surveyAnswer.token})}"
          method="post"
        >
          <div th:each="question, stat : ${questions}" class="card mb-4">
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label">
                  <strong>
                    <span th:text="${stat.count}">1</span>.
                    <span th:text="${question.label}"> Question </span>
                  </strong>

                  <span th:if="${question.required}" class="text-danger">
                    *
                  </span>
                </label>
              </div>

              <div th:if="${question.type == 'rating'}" class="mb-2">
                <div class="d-flex gap-3 flex-wrap">
                  <div
                    th:each="rating : ${#numbers.sequence(question.min, question.max)}"
                    class="form-check"
                  >
                    <input
                      class="form-check-input"
                      type="radio"
                      th:id="${question.id + '_' + rating}"
                      th:name="${question.id}"
                      th:value="${rating}"
                      th:required="${question.required}"
                    />

                    <label
                      class="form-check-label"
                      th:for="${question.id + '_' + rating}"
                      th:text="${rating}"
                    >
                      1
                    </label>
                  </div>
                </div>

                <div class="d-flex justify-content-between mt-2 text-muted">
                  <small>
                    <span th:text="${question.min}">1</span>
                    - Lowest
                  </small>

                  <small>
                    <span th:text="${question.max}">5</span>
                    - Highest
                  </small>
                </div>
              </div>

              <div th:if="${question.type == 'textarea'}">
                <textarea
                  class="form-control"
                  rows="4"
                  th:name="${question.id}"
                  th:required="${question.required}"
                  th:maxlength="${question.maxLength}"
                  placeholder="Write your answer here..."
                ></textarea>

                <small th:if="${question.maxLength != null}" class="text-muted">
                  Maximum
                  <span th:text="${question.maxLength}"> 2000 </span>
                  characters.
                </small>
              </div>

              <div th:if="${question.type == 'multiple_choice'}">
                <select
                  class="form-select"
                  th:name="${question.id}"
                  th:required="${question.required}"
                >
                  <option value="">Select an option</option>

                  <option
                    th:each="option : ${question.options}"
                    th:value="${option}"
                    th:text="${option}"
                  >
                    Option
                  </option>
                </select>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Submit survey</button>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
