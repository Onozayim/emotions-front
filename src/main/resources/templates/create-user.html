<!DOCTYPE html>
<html
  lang="en"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Create user</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="container py-4">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-7 col-lg-5">
            <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm mb-3">← Back to users</a>

            <div class="card shadow-sm">
              <div class="card-body p-4">
                <h1 class="h4 mb-2">Create user</h1>
                <p class="text-muted small mb-4">
                  We'll email this address a link to finish creating the account.
                </p>

                <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <form th:action="@{/create-user}" th:object="${create_user}" method="post">
                  <div class="mb-4">
                    <label class="form-label" for="email">Email</label>
                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      th:field="*{email}"
                      th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                      required
                    />
                    <div
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"
                      class="invalid-feedback"
                    ></div>
                  </div>

                  <button type="submit" class="btn btn-primary w-100">Send invitation</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
