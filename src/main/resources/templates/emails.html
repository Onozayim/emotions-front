<!doctype html>
<html
  lang="en"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Emails</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="container">
        <h1 class="h3 mb-3">Emails</h1>

        <form
          th:action="@{/emails}"
          method="get"
          class="row g-2 align-items-end mb-4"
        >
          <div class="col-sm-4 col-md-3">
            <label class="form-label" for="emotion">Emotion</label>
            <select class="form-select" id="emotion" name="emotion">
              <option value="">All emotions</option>
              <option
                th:each="e : ${emotions}"
                th:value="${e.key}"
                th:text="${e.label}"
                th:selected="${emotion == e.key}"
              ></option>
            </select>
          </div>

          <div class="col-sm-4 col-md-3">
            <label class="form-label" for="from">From</label>
            <input
              class="form-control"
              name="from"
              type="date"
              id="from"
              th:value="${from != null ? #dates.format(from, 'yyyy-MM-dd') : ''}"
            />
          </div>

          <div class="col-sm-4 col-md-3">
            <label class="form-label" for="to">To</label>
            <input
              class="form-control"
              name="to"
              type="date"
              id="to"
              th:value="${to != null ? #dates.format(to, 'yyyy-MM-dd') : ''}"
            />
          </div>

          <div class="col-auto">
            <button class="btn btn-primary" type="submit">Apply</button>
            <a th:href="@{/emails}" class="btn btn-outline-secondary">Clear</a>
          </div>
        </form>

        <div th:if="${#lists.isEmpty(emails)}" class="alert alert-secondary">
          No emails match these filters.
        </div>

        <ul th:unless="${#lists.isEmpty(emails)}" class="list-group">
          <li
            class="list-group-item d-flex justify-content-between align-items-center gap-3"
            th:each="i: ${emails}"
          >
            <div class="text-truncate">
              <a
                class="fw-semibold"
                th:href="@{/email/{id}(id=${i.getId()})}"
                th:text="${i.getSubject() ?: '(no subject)'}"
              ></a>
              <div class="small text-muted text-truncate">
                <span th:text="${i.getFrom()}"></span>
                ·
                <span
                  th:text="${#temporals.format(i.getCreatedAt(), 'yyyy-MM-dd HH:mm')}"
                ></span>
              </div>
            </div>
            <!-- Badges use each emotion's color from Emotion.java; unknown values stay gray -->

            <!-- Display corrected emotions when available -->
            <div
              class="d-flex gap-1 flex-shrink-0"
              th:with="
    effectivePrimary=${i.getFixedEmotion() != null ? i.getFixedEmotion() : i.getEmotion()},
    effectiveSecondary=${i.getFixedSecondaryEmotion() != null ? i.getFixedSecondaryEmotion() : i.getSecondaryEmotion()},
    effectiveCompound=${i.getFixedCompoundEmotion() != null ? i.getFixedCompoundEmotion() : i.getCompoundEmotion()}
  "
            >
              <th:block
                th:with="
      primaryEmotion=${emotionsByKey[#strings.toLowerCase(effectivePrimary ?: '')]},
      secondaryEmotion=${emotionsByKey[#strings.toLowerCase(effectiveSecondary ?: '')]},
      compoundEmotion=${emotionsByKey[#strings.toLowerCase(effectiveCompound ?: '')]}
    "
              >
                <!-- Primary emotion -->
                <span
                  th:unless="${#strings.isEmpty(effectivePrimary)}"
                  class="badge rounded-pill"
                  th:classappend="${primaryEmotion == null} ? 'text-bg-secondary'"
                  th:style="${primaryEmotion != null} ? |background-color: ${primaryEmotion.color}; color: ${primaryEmotion.textColor}|"
                  th:title="${i.getFixedEmotion() != null ? 'Corrected primary emotion' : 'Primary emotion'}"
                  th:text="${#strings.capitalize(effectivePrimary)}"
                ></span>

                <!-- Secondary emotion -->
                <span
                  th:unless="${#strings.isEmpty(effectiveSecondary)}"
                  class="badge rounded-pill"
                  th:classappend="${secondaryEmotion == null} ? 'text-bg-secondary'"
                  th:style="${secondaryEmotion != null} ? |background-color: ${secondaryEmotion.color}; color: ${secondaryEmotion.textColor}|"
                  th:title="${i.getFixedSecondaryEmotion() != null ? 'Corrected secondary emotion' : 'Secondary emotion'}"
                  th:text="${#strings.capitalize(effectiveSecondary)}"
                ></span>

                <!-- Compound emotion -->
                <span
                  th:unless="${#strings.isEmpty(effectiveCompound)}"
                  class="badge rounded-pill"
                  th:classappend="${compoundEmotion == null} ? 'text-bg-secondary'"
                  th:style="${compoundEmotion != null} ? |background-color: ${compoundEmotion.color}; color: ${compoundEmotion.textColor}|"
                  th:title="${i.getFixedCompoundEmotion() != null ? 'Corrected compound emotion' : 'Compound emotion'}"
                  th:text="${#strings.capitalize(effectiveCompound)}"
                ></span>
              </th:block>
            </div>
          </li>
        </ul>

        <nav th:replace="~{fragments/pagination :: pagination}"></nav>
      </div>
    </section>
  </body>
</html>
