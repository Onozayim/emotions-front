<!DOCTYPE html>
<html
  lang="en"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Create your account</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="container py-4">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm">
              <div class="card-body p-4">
                <div class="text-center mb-4">
                  <img th:src="@{/images/logo.png}" alt="" width="60" height="48" />
                  <h1 class="h4 mt-2 mb-0">Create your account</h1>
                </div>

                <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <form
                  th:action="@{/register/{token}(token=${token})}"
                  th:object="${register}"
                  method="post"
                >
                  <input type="hidden" th:field="*{token}" />

                  <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      th:field="*{email}"
                      th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                      autocomplete="username"
                      required
                    />
                    <div
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"
                      class="invalid-feedback"
                    ></div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input
                      type="password"
                      id="password"
                      class="form-control"
                      th:field="*{password}"
                      th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                      autocomplete="new-password"
                      required
                    />
                    <div
                      th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"
                      class="invalid-feedback"
                    ></div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label" for="confirmPassword">Confirm password</label>
                    <input
                      type="password"
                      id="confirmPassword"
                      class="form-control"
                      th:field="*{confirmPassword}"
                      th:classappend="${#fields.hasErrors('global')} ? 'is-invalid'"
                      autocomplete="new-password"
                      required
                    />
                    <div
                      th:if="${#fields.hasErrors('global')}"
                      class="invalid-feedback"
                    >
                      <div th:each="err : ${#fields.errors('global')}" th:text="${err}"></div>
                    </div>
                  </div>

                  <button type="submit" class="btn btn-primary w-100">Create account</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
