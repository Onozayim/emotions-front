<!doctype html>
<html
  lang="es"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Bootstrap demo</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="w-75 m-auto bg-red-700">
        <h1 th:text="${email.getSubject()}"></h1>
        <h6 th:text="${email.getFrom()}"></h6>

        <div
          id="email-editor"
          class="w-25"
          th:data-update-url="@{/email/{id}(id=${email.getId()})}"
          th:data-current-primary="${email.getFixedEmotion() ?: email.getEmotion()}"
          th:data-current-secondary="${email.getFixedSecondaryEmotion() ?: email.getSecondaryEmotion()}"
        >
          <select
            class="form-select form-select-sm w-25 mb-2"
            name="primary_emotion"
            id="primary_emotion"
          >
            <option
              th:each="emotion : ${emotions}"
              th:unless="${emotion.compound}"
              th:value="${emotion.key}"
              th:text="${emotion.label}"
            ></option>
          </select>

          <select
            class="form-select form-select-sm w-25 mb-2"
            name="secondary_emotion"
            id="secondary_emotion"
          >
            <option
              th:each="emotion : ${emotions}"
              th:unless="${emotion.compound}"
              th:value="${emotion.key}"
              th:text="${emotion.label}"
            ></option>
          </select>

          <p id="compound_emotion" th:text="${email.getCompoundEmotion()}"></p>

          <button id="update_emotion" type="button" class="btn btn-primary">
            Update
          </button>
        </div>

        <hr />
        <!-- Email bodies come from external senders: render them in a sandbox with scripts disabled -->
        <iframe
          id="email_content"
          class="w-100 border-0"
          title="Email content"
          sandbox="allow-same-origin"
          th:attr="srcdoc=${email.getBody()}"
        ></iframe>
      </div>

      <script id="emotions-data" type="application/json" th:inline="javascript">
        [[${emotions}]]
      </script>
      <script th:src="@{/js/emotions.js}" defer></script>
      <script th:src="@{/js/email.js}" defer></script>
    </section>
  </body>
</html>
