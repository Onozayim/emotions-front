<!DOCTYPE html>
<html
  lang="es"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Bootstrap demo</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="w-75 mx-auto mb-2">
        <a th:href="@{/create-user}" class="btn btn-primary">Create user</a>
      </div>
      <ul class="list-group list-group-light w-75 m-auto">
        <li
          class="list-group-item d-flex justify-content-between align-items-center"
          th:each="i: ${users}"
        >
          <div>
            <div class="fw-bold" th:text="${i.getEmail()}"></div>
            <div class="text-muted small" th:text="'ID ' + ${i.getId()}"></div>
          </div>
          <button
            type="button"
            class="btn btn-outline-danger btn-sm delete-user"
            th:attr="aria-label='Delete ' + ${i.getEmail()}"
            th:data-delete-url="@{/users/{id}(id=${i.getId()})}"
          >
            Delete
          </button>
        </li>
      </ul>

      <nav th:replace="~{fragments/pagination :: pagination}"></nav>

      <script th:src="@{/js/users.js}" defer></script>
    </section>
  </body>
</html>
