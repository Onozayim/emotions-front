<!doctype html>
<html
  lang="en"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Emails</title>
  </head>
  <body>
    <section layout:fragment="content">
      <div class="container">
        <h1 class="h3 mb-3">Emails</h1>

        <form th:action="@{/emails}" method="get" class="row g-2 align-items-end mb-4">
          <div class="col-sm-4 col-md-3">
            <label class="form-label" for="emotion">Emotion</label>
            <select class="form-select" id="emotion" name="emotion">
              <option value="">All emotions</option>
              <option
                th:each="e : ${emotions}"
                th:value="${e.key}"
                th:text="${e.label}"
                th:selected="${emotion == e.key}"
              ></option>
            </select>
          </div>

          <div class="col-sm-4 col-md-3">
            <label class="form-label" for="from">From</label>
            <input
              class="form-control"
              name="from"
              type="date"
              id="from"
              th:value="${from != null ? #dates.format(from, 'yyyy-MM-dd') : ''}"
            />
          </div>

          <div class="col-sm-4 col-md-3">
            <label class="form-label" for="to">To</label>
            <input
              class="form-control"
              name="to"
              type="date"
              id="to"
              th:value="${to != null ? #dates.format(to, 'yyyy-MM-dd') : ''}"
            />
          </div>

          <div class="col-auto">
            <button class="btn btn-primary" type="submit">Apply</button>
            <a th:href="@{/emails}" class="btn btn-outline-secondary">Clear</a>
          </div>
        </form>

        <div th:if="${#lists.isEmpty(emails)}" class="alert alert-secondary">
          No emails match these filters.
        </div>

        <ul th:unless="${#lists.isEmpty(emails)}" class="list-group">
          <li
            class="list-group-item d-flex justify-content-between align-items-center gap-3"
            th:each="i: ${emails}"
          >
            <div class="text-truncate">
              <a
                class="fw-semibold"
                th:href="@{/email/{id}(id=${i.getId()})}"
                th:text="${i.getSubject() ?: '(no subject)'}"
              ></a>
              <div class="small text-muted text-truncate">
                <span th:text="${i.getFrom()}"></span>
                ·
                <span th:text="${#temporals.format(i.getCreatedAt(), 'yyyy-MM-dd HH:mm')}"></span>
              </div>
            </div>
            <div class="d-flex gap-1 flex-shrink-0">
              <span
                th:unless="${#strings.isEmpty(i.getEmotion())}"
                class="badge rounded-pill text-bg-secondary"
                th:title="'Primary emotion'"
                th:text="${#strings.capitalize(i.getEmotion())}"
              ></span>
              <span
                th:unless="${#strings.isEmpty(i.getCompoundEmotion())}"
                class="badge rounded-pill text-bg-light border"
                th:title="'Compound emotion'"
                th:text="${#strings.capitalize(i.getCompoundEmotion())}"
              ></span>
            </div>
          </li>
        </ul>

        <nav th:replace="~{fragments/pagination :: pagination}"></nav>
      </div>
    </section>
  </body>
</html>
