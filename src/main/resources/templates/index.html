<!doctype html>
<html
  lang="es"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="layouts/layout"
>
  <head>
    <title>Bootstrap demo</title>
  </head>
  <body>
    <section layout:fragment="content">
      <form th:action="@{/}" method="get">
        <div class="row my-2 mx-2 w-75">
          <div class="col-md-3">
            <label class="" for="from">From</label>
            <input
              class="form-control"
              name="from"
              type="date"
              id="from"
              th:value="${from}"
            />
          </div>

          <div class="col-md-3">
            <label class="" for="to">To</label>
            <input
              class="form-control"
              name="to"
              type="date"
              id="to"
              th:value="${to}"
            />
          </div>

          <div class="col-md-3 d-flex flex-column">
            <button class="btn btn-primary mt-auto" type="submit">
              Search
            </button>
          </div>
        </div>
      </form>

      <div class="w-75 mx-auto">
        <canvas id="myChart"></canvas>
      </div>

      <div class="w-75 mx-auto">
        <canvas id="myChart2"></canvas>
      </div>

      <script id="emotions-data" type="application/json" th:inline="javascript">
        [[${emotions}]]
      </script>
      <script id="dashboard-data" type="application/json" th:inline="javascript">
        { "totals": [[${totals}]], "series": [[${email_counts}]] }
      </script>
      <script th:src="@{/js/emotions.js}" defer></script>
      <script th:src="@{/js/dashboard.js}" defer></script>
    </section>
  </body>
</html>
