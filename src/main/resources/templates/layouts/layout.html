<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">EPM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav
      class="navbar navbar-dark bg-dark navbar-expand-lg mb-4"
      th:with="path=${currentPath ?: ''}"
    >
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
          <img
            th:src="@{/images/logo.png}"
            alt=""
            width="30"
            height="24"
            class="d-inline-block align-text-top"
          />
          EPM - Emotion Detector
        </a>
        <button
          class="navbar-toggler"
          type="button"
          sec:authorize="isAuthenticated()"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-between"
          id="mainNav"
          sec:authorize="isAuthenticated()"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link"
                th:href="@{/}"
                th:classappend="${path == '/'} ? 'active'"
                th:attr="aria-current=${path == '/'} ? 'page' : null"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:href="@{/emails}"
                th:classappend="${#strings.startsWith(path, '/email')} ? 'active'"
                th:attr="aria-current=${#strings.startsWith(path, '/email')} ? 'page' : null"
                >Emails</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:href="@{/users}"
                th:classappend="${#strings.startsWith(path, '/users') or path == '/create-user'} ? 'active'"
                th:attr="aria-current=${#strings.startsWith(path, '/users') or path == '/create-user'} ? 'page' : null"
                >Users</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:href="@{/surveys}"
                th:classappend="${#strings.startsWith(path, '/surveys')} ? 'active'"
                th:attr="aria-current=${#strings.startsWith(path, '/surveys')} ? 'page' : null"
                >Surveys</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:href="@{/survey-templates}"
                th:classappend="${#strings.startsWith(path, '/survey-templates')} ? 'active'"
                th:attr="aria-current=${#strings.startsWith(path, '/survey-templates')} ? 'page' : null"
                >Templates</a
              >
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/logout}">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">
      <section layout:fragment="content"></section>
    </main>

    <footer class="text-center text-white bg-dark mt-5">
      <div class="p-3" style="background-color: rgba(0, 0, 0, 0.2)">
        ©
        <span th:text="${#temporals.year(#temporals.createNow())}">2026</span>
        Copyright:
        <a class="text-white" href="https://montesdevoca.com/">montesdevoca.com</a>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
